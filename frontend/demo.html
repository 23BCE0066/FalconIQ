<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="assets/css/variables.css" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --bg-page: #f4f5fc;
      --bg-card: #ffffff;
      --border: #e5e7f3;
      --text-main: #0f0e2a;
      --text-sub: #6b7280;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .video-tour-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .tour-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      z-index: 100;
    }
    .tour-stage {
      flex: 1;
      position: relative;
      overflow-y: auto;
      padding: 30px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-page);
    }
    .scene-wrapper {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease-in-out;
    }
    .tour-footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
      z-index: 100;
    }
    .caption-box {
      background: #f8f9fe;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 22px;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .chapters-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      padding: 2px 0;
    }
    .chapter-btn {
      background: #f1f3fa;
      border: 1.5px solid var(--border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .chapter-btn:hover {
      background: #e2e5f3;
      color: var(--text-main);
    }
    .chapter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn-action {
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #f8f9fe;
      border-color: var(--primary-light);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: 1.5px solid var(--primary);
      color: #ffffff;
      padding: 9px 22px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bouncePointer {
      0%, 100% { transform: translateY(0) rotate(-12deg); }
      50% { transform: translateY(-8px) rotate(-12deg); }
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .pointer-badge {
      position: absolute;
      z-index: 10;
      background: #0f172a;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .card-clean {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
  </style>
</head>

    let currentIndex = 0;
    let isPaused = false;
    let sceneTimer = null;
    let isAudioEnabled = true;
    let synth = window.speechSynthesis;

    const viewport = document.getElementById('stage-viewport');
    const sceneContent = document.getElementById('scene-content');
    const captionText = document.getElementById('caption-text');
    const chaptersContainer = document.getElementById('chapters-container');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnPause = document.getElementById('btn-pause');
    const btnMute = document.getElementById('toggle-mute');
    const muteText = document.getElementById('mute-text');
    const muteIcon = document.getElementById('mute-icon');

    // Render Chapters Buttons
    function renderChapters() {
      chaptersContainer.innerHTML = tourScenes.map((s, idx) => `
        <button class="chapter-btn ${idx === currentIndex ? 'active' : ''}" onclick="goToScene(${idx})">
          ${s.title}
        </button>
      `).join('');
    }

    // Speak narration with smooth executive tone
    function speakScript(text) {
      if (synth) {
        synth.cancel();
      }
      if (!isAudioEnabled || !synth) return;

      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.02;
      u.pitch = 1.0;
      u.lang = 'en-US';

      // Seek high quality voices
      const voices = synth.getVoices();
      if (voices.length > 0) {
        const best = voices.find(v => (v.name.includes('Samantha') || v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Daniel') || v.name.includes('Alex')) && v.lang.startsWith('en')) || voices[0];
        if (best) u.voice = best;
      }

      synth.speak(u);
    }

    // Load Scene
    function loadScene(idx) {
      if (idx < 0) idx = 0;
      if (idx >= tourScenes.length) idx = tourScenes.length - 1;
      currentIndex = idx;

      clearTimeout(sceneTimer);
      if (synth) synth.cancel();

      const scene = tourScenes[currentIndex];
      
      // Animate transition
      sceneContent.style.opacity = '0';
      sceneContent.style.transform = 'translateY(10px)';
      
      setTimeout(() => {
        sceneContent.innerHTML = scene.html;
        captionText.textContent = `"${scene.script}"`;
        sceneContent.style.opacity = '1';
        sceneContent.style.transform = 'translateY(0)';
        
        renderChapters();

        if (!isPaused) {
          speakScript(scene.script);
          sceneTimer = setTimeout(() => {
            if (currentIndex < tourScenes.length - 1) {
              loadScene(currentIndex + 1);
            }
          }, scene.duration);
        }
      }, 150);
    }

    window.goToScene = function(idx) {
      isPaused = false;
      btnPause.innerHTML = '⏸ Pause';
      loadScene(idx);
    };

    window.restartTour = function() {
      isPaused = false;
      btnPause.innerHTML = '⏸ Pause';
      loadScene(0);
    };

    btnPrev.addEventListener('click', () => {
      if (currentIndex > 0) loadScene(currentIndex - 1);
    });

    btnNext.addEventListener('click', () => {
      if (currentIndex < tourScenes.length - 1) loadScene(currentIndex + 1);
    });

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        clearTimeout(sceneTimer);
        if (synth) synth.cancel();
        btnPause.innerHTML = '▶ Resume';
      } else {
        btnPause.innerHTML = '⏸ Pause';
        loadScene(currentIndex);
      }
    });

    btnMute.addEventListener('click', () => {
      isAudioEnabled = !isAudioEnabled;
      if (isAudioEnabled) {
        muteIcon.textContent = '🔊';
        muteText.textContent = 'Audio: On';
        speakScript(tourScenes[currentIndex].script);
      } else {
        muteIcon.textContent = '🔇';
        muteText.textContent = 'Audio: Muted';
        if (synth) synth.cancel();
      }
    });

    // Initialize Voice Synthesis & First Scene
    window.addEventListener('load', () => {
      if (synth) {
        synth.onvoiceschanged = () => { /* voices loaded */ };
      }
      loadScene(0);
    });
  </script>
